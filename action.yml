name: 'TYPO3 Ter Uploader'
description: 'GitHub Action that helps you upload your Extensions to TER'
branding:
  icon: upload
  color: orange
inputs:
  api-token:
    description: 'Your TYPO3 API Token - Use github.secrets'
    required: true
    default: ''
  php-version:
    description: 'PHP for the prepare-release script: 8.3, 8.4, 8.5 or auto (from require.php in composer.json). Tailor always runs on PHP 8.5.'
    required: false
    default: 'auto'
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.api-token }}
    - ${{ inputs.php-version }}